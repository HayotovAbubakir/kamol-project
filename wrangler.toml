name = "kamol-project"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public", "nodejs_compat_populate_process_env"]

# Cloudflare Dashboard → Settings → Build (ANIQ shu matn, emoji/belgi QO'SHMA):
#   Build command:  npm run build
#   Deploy command: node scripts/deploy-cloudflare.mjs

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kamol-project"

# Cloudflare Dashboard → Settings → Build:
#   Build command:  npm run build
#   Deploy command: node scripts/deploy-cloudflare.mjs
#
# Cloudflare Dashboard → Settings → Build → Build variables:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SESSION_SECRET
#   ADMIN_INITIAL_PASSWORD=admin123  (deploy paytida admin parolini sync qiladi)
